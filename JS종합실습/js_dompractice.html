<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' href='js_dompractice.css'>
    
</head>
<body>
    <div id="wrap">

        <div id="header">
            <select id="category">
                <option value="disabled">카테고리 선택하세요.</option>
                <option value="1">음료</option>
                <option value="2">과자</option>
            </select>
            <input type="text" id="pushName" placeholder="제품명"/>
            <input type="number" id="pushPrice" placeholder="제품가격"/>
            <input type="file" id="pushImage"/>
            <button onclick="productAdd()">등록</button>
        </div>



        <div id="main">
            <table>
                <thead>
                    <tr>
                        <th>이미지</th>
                        <th>카테고리명</th>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>등록일</th>
                        <th>비고</th>
                    </tr>
                </thead>
                <tbody id="productTable">
                </tbody>
            </table>
        </div>
    </div>




    <script src='js_dompractice.js'></script>
</body>
</html>
